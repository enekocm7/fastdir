[package]
name = "fastdir"
version = "0.1.0"
edition = "2024"
description = "Blazing fast disk usage analyzer with a WinDirStat-style treemap"
repository = "https://github.com/enekocm7/fastdir"

[dependencies]
gpui-kit = { version = "0.8.1", features = ["gpui-fast"] }
rayon = "1.12"
parking_lot = "0.12"
image = { version = "0.25", default-features = false }
smallvec = "1.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
ureq = "3"
semver = "1.0.28"
sha2 = "0.11.1"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "abort"

# Dependencies (gpui is huge) build with parallel codegen; only our own
# crate pays for codegen-units = 1. Much faster cold builds in CI.
[profile.release.package."*"]
codegen-units = 16

# Keep debug builds usable: the scanner and treemap renderer are hot loops.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[build-dependencies]
resvg = { version = "0.45", default-features = false, features = [] }
embed-resource = "3"
