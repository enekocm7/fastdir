name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build the installer and upload it as a workflow artifact
  # without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            # The workspace keeps a single version in [workspace.package].
            $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
            $version = ($meta.packages | Where-Object { $_.name -eq "fastdir" }).version
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Build
        run: cargo build --release --locked

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # build.rs renders assets/logo.svg into this icon.
          $ico = Get-ChildItem target -Recurse -Filter fastdir.ico | Select-Object -First 1
          if (-not $ico) { throw "fastdir.ico not found" }
          & $iscc /Qp `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceExe=$pwd\target\release\fastdir.exe" `
            "/DIconFile=$($ico.FullName)" `
            "/DOutputDir=$pwd\dist" `
            installer\fastdir.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item target\release\fastdir.exe staging\FastDir.exe
          Copy-Item README.md staging\
          Compress-Archive -Path staging\* -DestinationPath "dist\FastDir-$v-portable-x64.zip" -Force
          Get-ChildItem dist | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastDir-${{ steps.version.outputs.version }}-windows-x64
          path: dist/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: FastDir ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          # Verified GPUI build inputs on Ubuntu 24.04 (gpui-kit install
          # guide); libasound2-dev is only needed by the `speech` feature.
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang pkg-config libfontconfig-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev \
            vulkan-validationlayers libvulkan1

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # The workspace keeps a single version in [workspace.package].
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "fastdir") | .version')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Build
        run: cargo build --release --locked

      - name: Package tarball
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p staging dist
          cp target/release/fastdir staging/FastDir
          cp README.md staging/
          tar -czf "dist/FastDir-$v-linux-x64.tar.gz" -C staging .
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastDir-${{ steps.version.outputs.version }}-linux-x64
          path: dist/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: FastDir ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

  macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # The workspace keeps a single version in [workspace.package].
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "fastdir") | .version')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Build
        run: cargo build --release --locked

      - name: Package tarball and dmg
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p staging dist dmg-root
          cp target/release/fastdir staging/FastDir
          cp README.md staging/
          tar -czf "dist/FastDir-$v-macos-arm64.tar.gz" -C staging .
          cp staging/FastDir dmg-root/FastDir
          cp README.md dmg-root/
          hdiutil create -volname "FastDir $v" -srcfolder dmg-root \
            -ov -format UDZO "dist/FastDir-$v-macos-arm64.dmg"
          (cd dist && shasum -a 256 ./* > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastDir-${{ steps.version.outputs.version }}-macos-arm64
          path: dist/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: FastDir ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
