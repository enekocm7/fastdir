name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build the installer and upload it as a workflow artifact
  # without publishing a release.
  workflow_dispatch:
    inputs:
      sign:
        description: Code-sign the Windows binaries and installer (needs the signing secrets)
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    env:
      # Code signing (packaging/README.md, "Windows code signing"). Either
      # Azure Artifact Signing or SignPath; without their secrets nothing is
      # signed and the build is otherwise unchanged.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            # The workspace keeps a single version in [workspace.package].
            $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
            $version = ($meta.packages | Where-Object { $_.name -eq "fastdir" }).version
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      # Releases are signed whenever a provider is configured; manual runs
      # only when asked (`sign` input), to save signing quota.
      - name: Choose signing provider
        id: sign
        shell: pwsh
        run: |
          $wanted = $env:GITHUB_REF_TYPE -eq "tag" -or "${{ inputs.sign }}" -eq "true"
          $provider = "none"
          if ($wanted -and $env:AZURE_CLIENT_ID) { $provider = "azure" }
          elseif ($wanted -and $env:SIGNPATH_API_TOKEN) { $provider = "signpath" }
          "provider=$provider" >> $env:GITHUB_OUTPUT
          Write-Host "Signing provider: $provider"

      - name: Build
        run: cargo build --release --locked

      # The binaries are signed before they go into the installer and the
      # portable zip, so every copy a user runs carries the signature.
      - name: Sign binaries (Azure Artifact Signing)
        if: steps.sign.outputs.provider == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\release\fastdir.exe
            ${{ github.workspace }}\target\release\fastdir-cli.exe
          description: FastDir
          description-url: https://github.com/enekocm7/fastdir

      - name: Upload unsigned binaries for SignPath
        id: unsigned-binaries
        if: steps.sign.outputs.provider == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: |
            target/release/fastdir.exe
            target/release/fastdir-cli.exe

      - name: Sign binaries (SignPath)
        if: steps.sign.outputs.provider == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'fastdir' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-binaries

      - name: Use the SignPath-signed binaries
        if: steps.sign.outputs.provider == 'signpath'
        shell: pwsh
        run: Copy-Item signed-binaries\*.exe target\release\ -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # build.rs renders assets/logo.svg into this icon.
          $ico = Get-ChildItem target -Recurse -Filter fastdir.ico | Select-Object -First 1
          if (-not $ico) { throw "fastdir.ico not found" }
          & $iscc /Qp `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceExe=$pwd\target\release\fastdir.exe" `
            "/DSourceCliExe=$pwd\target\release\fastdir-cli.exe" `
            "/DIconFile=$($ico.FullName)" `
            "/DOutputDir=$pwd\dist" `
            installer\fastdir.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer (Azure Artifact Signing)
        if: steps.sign.outputs.provider == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\FastDir-${{ steps.version.outputs.version }}-setup-x64.exe
          description: FastDir Setup
          description-url: https://github.com/enekocm7/fastdir

      - name: Upload unsigned installer for SignPath
        id: unsigned-installer
        if: steps.sign.outputs.provider == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/FastDir-${{ steps.version.outputs.version }}-setup-x64.exe

      - name: Sign installer (SignPath)
        if: steps.sign.outputs.provider == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'fastdir' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Use the SignPath-signed installer
        if: steps.sign.outputs.provider == 'signpath'
        shell: pwsh
        run: Copy-Item signed-installer\*.exe dist\ -Force

      - name: Check signatures
        if: steps.sign.outputs.provider != 'none'
        shell: pwsh
        run: |
          $files = "target\release\fastdir.exe", "target\release\fastdir-cli.exe",
            "dist\FastDir-${{ steps.version.outputs.version }}-setup-x64.exe"
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f : $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { throw "$f is not validly signed" }
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item target\release\fastdir.exe staging\FastDir.exe
          Copy-Item target\release\fastdir-cli.exe staging\fastdir-cli.exe
          Copy-Item README.md staging\
          Compress-Archive -Path staging\* -DestinationPath "dist\FastDir-$v-portable-x64.zip" -Force

      # Validates the Chocolatey and Scoop manifests on every run, so a
      # broken template fails here instead of in the publishing jobs.
      - name: Check package manifests
        shell: pwsh
        run: |
          choco pack packaging\chocolatey\fastdir.nuspec --out "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content packaging\scoop\fastdir.json -Raw | ConvertFrom-Json | Out-Null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastDir-${{ steps.version.outputs.version }}-windows-x64
          path: dist/*

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    # Built against glibc 2.35 (Ubuntu 22.04), so the binaries, the .deb and
    # the AppImage also run on Debian 12 and other distros older than the
    # runner. Bump only together with the oldest distro you want to support.
    container: ubuntu:22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y sudo curl git ca-certificates jq xz-utils file

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          # Verified GPUI build inputs (gpui-kit install guide);
          # libasound2-dev is only needed by the `speech` feature.
          sudo apt-get install -y gcc g++ clang pkg-config libfontconfig-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev \
            vulkan-validationlayers libvulkan1

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # The workspace keeps a single version in [workspace.package].
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "fastdir") | .version')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Build
        run: cargo build --release --locked

      - name: Package tarball
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p staging dist
          cp target/release/fastdir staging/FastDir
          cp target/release/fastdir-cli staging/fastdir-cli
          cp README.md LICENSE staging/
          tar -czf "dist/FastDir-$v-linux-x64.tar.gz" -C staging .

      - name: Install packaging tools
        run: |
          # No `appstream` here: 22.04's validator predates tags the
          # metainfo uses (the `metadata` job validates with a current one).
          sudo apt-get install -y dpkg-dev binutils librsvg2-bin desktop-file-utils
          curl -fsSLo nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo apt-get install -y ./nfpm.deb
          sudo curl -fsSLo /usr/local/bin/linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          sudo chmod +x /usr/local/bin/linuxdeploy
        env:
          NFPM_VERSION: 2.48.0
          LINUXDEPLOY_VERSION: 1-alpha-20251107-1

      - name: Build .deb, .rpm and AppImage
        run: packaging/linux/package.sh "${{ steps.version.outputs.version }}" target/release dist
        env:
          # GitHub runners have no FUSE for the linuxdeploy AppImage itself.
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastDir-${{ steps.version.outputs.version }}-linux-x64
          path: dist/*

  # Desktop entry and AppStream metadata, checked with current validators
  # (software centers and Flathub read the newer AppStream tags).
  metadata:
    name: Validate Linux metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate packaging/linux/io.github.enekocm7.FastDir.desktop
          appstreamcli validate --no-net --explain \
            packaging/linux/io.github.enekocm7.FastDir.metainfo.xml

  macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # The workspace keeps a single version in [workspace.package].
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "fastdir") | .version')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Build
        run: cargo build --release --locked

      - name: Package tarball and dmg
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p staging dist dmg-root
          cp target/release/fastdir staging/FastDir
          cp target/release/fastdir-cli staging/fastdir-cli
          cp README.md staging/
          tar -czf "dist/FastDir-$v-macos-arm64.tar.gz" -C staging .
          cp staging/FastDir dmg-root/FastDir
          cp staging/fastdir-cli dmg-root/fastdir-cli
          cp README.md dmg-root/
          hdiutil create -volname "FastDir $v" -srcfolder dmg-root \
            -ov -format UDZO "dist/FastDir-$v-macos-arm64.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastDir-${{ steps.version.outputs.version }}-macos-arm64
          path: dist/*

  # Installs the packages on clean distro images and runs both binaries, so a
  # missing runtime dependency fails the release instead of a user's install.
  linux-test:
    name: Install test (${{ matrix.image }}, ${{ matrix.format }})
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", format: deb }
          - { image: "ubuntu:24.04", format: deb }
          - { image: "fedora:latest", format: rpm }
          - { image: "debian:12", format: AppImage }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FastDir-${{ needs.linux.outputs.version }}-linux-x64
          path: dist

      - name: Install the package
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.format }}" in
            deb)
              apt-get update
              apt-get install -y ./dist/*.deb
              fastdir=fastdir; cli=fastdir-cli ;;
            rpm)
              dnf install -y ./dist/*.rpm
              fastdir=fastdir; cli=fastdir-cli ;;
            AppImage)
              apt-get update
              # What a desktop already has; the AppImage brings the rest.
              apt-get install -y libfontconfig1 libvulkan1 libwayland-client0 \
                libxkbcommon0 libxkbcommon-x11-0
              chmod +x dist/*.AppImage
              export APPIMAGE_EXTRACT_AND_RUN=1
              fastdir=$(ls "$PWD"/dist/*.AppImage)
              cli=$fastdir ;;
          esac
          if [ "${{ matrix.format }}" != AppImage ]; then
            # Every shared library resolves, the files are where the desktop
            # and software centers look for them.
            ! ldd /usr/bin/fastdir /usr/bin/fastdir-cli | grep 'not found'
            test -f /usr/share/applications/io.github.enekocm7.FastDir.desktop
            test -f /usr/share/metainfo/io.github.enekocm7.FastDir.metainfo.xml
            test -f /usr/share/icons/hicolor/256x256/apps/io.github.enekocm7.FastDir.png
            test -f /usr/share/icons/hicolor/scalable/apps/io.github.enekocm7.FastDir.svg
          fi
          # The GUI binary runs headless for CLI subcommands, which loads all
          # of its libraries; then scan the whole file system.
          "$fastdir" scan /usr --max-depth 1 > /dev/null
          "$cli" scan / --max-depth 1 > scan.json
          head -c 400 scan.json; echo

  # Builds the Nix flake so `nix run github:enekocm7/fastdir` keeps working.
  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Build
        run: |
          nix build -L .#fastdir
          ./result/bin/fastdir-cli scan / --max-depth 1 > /dev/null
          nix flake check --no-build

  # One release with every platform's files and a single SHA256SUMS.txt (the
  # in-app updater looks its download up in that file).
  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [windows, linux, macos, metadata, linux-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FastDir-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: FastDir ${{ needs.linux.outputs.version }}
          generate_release_notes: true
          files: dist/*

  # Pushes the `fastdir-bin` PKGBUILD to the AUR for stable tags. Needs the
  # AUR_SSH_PRIVATE_KEY secret (an SSH key registered with the AUR account
  # that owns the package); skipped without it.
  aur:
    name: AUR (fastdir-bin)
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: [linux, publish]
    runs-on: ubuntu-24.04
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.AUR_SSH_PRIVATE_KEY != ''

      - uses: actions/download-artifact@v4
        if: env.AUR_SSH_PRIVATE_KEY != ''
        with:
          name: FastDir-${{ needs.linux.outputs.version }}-linux-x64
          path: dist

      - name: Fill in version and checksum
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          v="${{ needs.linux.outputs.version }}"
          sum=$(sha256sum "dist/FastDir-$v-amd64.deb" | cut -d' ' -f1)
          sed -i -e "s/^pkgver=.*/pkgver=$v/" -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/aur/fastdir-bin/PKGBUILD
          cat packaging/aur/fastdir-bin/PKGBUILD

      - name: Push to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: fastdir-bin
          pkgbuild: packaging/aur/fastdir-bin/PKGBUILD
          commit_username: ${{ vars.AUR_COMMIT_USERNAME || 'enekocm7' }}
          commit_email: ${{ vars.AUR_COMMIT_EMAIL || 'enekocm7@users.noreply.github.com' }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.linux.outputs.version }}

  # Windows package managers, stable tags only. Each job is skipped until its
  # secret exists; the one-time setup is in packaging/README.md.

  # Opens a pull request on microsoft/winget-pkgs with komac. Needs the
  # WINGET_TOKEN secret (a classic PAT with `public_repo`, from the account
  # that owns a fork of winget-pkgs) and a first version already in winget.
  winget:
    name: winget (enekocm7.FastDir)
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: [publish]
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: enekocm7.FastDir
          installers-regex: '-setup-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: ${{ vars.WINGET_FORK_USER || github.repository_owner }}

  # Updates bucket/fastdir.json in a Scoop bucket repository (default
  # enekocm7/scoop-bucket). Needs the SCOOP_BUCKET_TOKEN secret: a
  # fine-grained PAT with Contents read/write on that repository.
  scoop:
    name: Scoop bucket
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: [linux, publish]
    runs-on: ubuntu-24.04
    env:
      SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO || 'enekocm7/scoop-bucket' }}
    steps:
      - uses: actions/checkout@v4
        if: env.SCOOP_BUCKET_TOKEN != ''

      - uses: actions/checkout@v4
        if: env.SCOOP_BUCKET_TOKEN != ''
        with:
          repository: ${{ env.BUCKET_REPO }}
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: bucket-repo

      - name: Update the manifest
        if: env.SCOOP_BUCKET_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.linux.outputs.version }}"
          zip="FastDir-$v-portable-x64.zip"
          gh release download "v$v" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt
          hash=$(awk -v f="$zip" '$2 == f { print $1 }' SHA256SUMS.txt)
          test -n "$hash"
          mkdir -p bucket-repo/bucket
          jq --arg v "$v" --arg hash "$hash" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$v/$zip" \
            '.version = $v | .architecture."64bit".url = $url | .architecture."64bit".hash = $hash' \
            packaging/scoop/fastdir.json > bucket-repo/bucket/fastdir.json
          cat bucket-repo/bucket/fastdir.json

      - name: Push
        if: env.SCOOP_BUCKET_TOKEN != ''
        working-directory: bucket-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/fastdir.json
          git diff --cached --quiet && exit 0
          git commit -m "fastdir: Update to version ${{ needs.linux.outputs.version }}"
          git push

  # Packs packaging/chocolatey and pushes it to the Chocolatey community
  # repository (each version goes through its moderation). Needs the
  # CHOCOLATEY_API_KEY secret.
  chocolatey:
    name: Chocolatey
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: [linux, publish]
    runs-on: windows-2025
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.CHOCOLATEY_API_KEY != ''

      - name: Pack and push
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ needs.linux.outputs.version }}"
          $setup = "FastDir-$v-setup-x64.exe"
          gh release download "v$v" --repo $env:GITHUB_REPOSITORY --pattern SHA256SUMS.txt
          $line = Get-Content SHA256SUMS.txt | Where-Object { $_ -match "\s\*?$([regex]::Escape($setup))$" }
          if (-not $line) { throw "$setup is not in SHA256SUMS.txt" }
          $sum = ($line -split '\s+')[0]
          $install = "packaging\chocolatey\tools\chocolateyinstall.ps1"
          (Get-Content $install -Raw) `
            -replace "(?m)^\`$version = '.*'", "`$version = '$v'" `
            -replace "(?m)^\`$checksum = '.*'", "`$checksum = '$sum'" |
            Set-Content $install -NoNewline
          $nuspec = "packaging\chocolatey\fastdir.nuspec"
          (Get-Content $nuspec -Raw) -replace '<version>.*</version>', "<version>$v</version>" |
            Set-Content $nuspec -NoNewline
          Get-Content $install
          choco pack $nuspec --out dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco push "dist\fastdir.$v.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
