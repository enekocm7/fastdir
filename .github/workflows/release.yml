name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build the installer and upload it as a workflow artifact
  # without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with warm-cache.yml, which keeps the main cache this
          # restores. A tag run can only read caches from its own tag or
          # main, so saving one here would never be used again.
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            # The workspace keeps a single version in [workspace.package].
            $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
            $version = ($meta.packages | Where-Object { $_.name -eq "fastdir" }).version
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Build
        run: cargo build --release --locked

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # build.rs renders assets/logo.svg into this icon.
          $ico = Get-ChildItem target -Recurse -Filter fastdir.ico | Select-Object -First 1
          if (-not $ico) { throw "fastdir.ico not found" }
          & $iscc /Qp `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceExe=$pwd\target\release\fastdir.exe" `
            "/DSourceCliExe=$pwd\target\release\fastdir-cli.exe" `
            "/DIconFile=$($ico.FullName)" `
            "/DOutputDir=$pwd\dist" `
            installer\fastdir.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item target\release\fastdir.exe staging\FastDir.exe
          Copy-Item target\release\fastdir-cli.exe staging\fastdir-cli.exe
          Copy-Item README.md staging\
          Compress-Archive -Path staging\* -DestinationPath "dist\FastDir-$v-portable-x64.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastDir-${{ steps.version.outputs.version }}-windows-x64
          path: dist/*

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    # Built against glibc 2.35 (Ubuntu 22.04), so the binaries, the .deb and
    # the AppImage also run on Debian 12 and other distros older than the
    # runner. Bump only together with the oldest distro you want to support.
    container: ubuntu:22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y sudo curl git ca-certificates jq xz-utils file

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with warm-cache.yml, which keeps the main cache this
          # restores. A tag run can only read caches from its own tag or
          # main, so saving one here would never be used again.
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install system dependencies
        run: |
          # Verified GPUI build inputs (gpui-kit install guide);
          # libasound2-dev is only needed by the `speech` feature.
          sudo apt-get install -y gcc g++ clang pkg-config libfontconfig-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev \
            vulkan-validationlayers libvulkan1

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # The workspace keeps a single version in [workspace.package].
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "fastdir") | .version')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Build
        run: cargo build --release --locked

      - name: Package tarball
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p staging dist
          cp target/release/fastdir staging/FastDir
          cp target/release/fastdir-cli staging/fastdir-cli
          cp README.md LICENSE staging/
          tar -czf "dist/FastDir-$v-linux-x64.tar.gz" -C staging .

      - name: Install packaging tools
        run: |
          # No `appstream` here: 22.04's validator predates tags the
          # metainfo uses (the `metadata` job validates with a current one).
          sudo apt-get install -y dpkg-dev binutils librsvg2-bin desktop-file-utils
          curl -fsSLo nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo apt-get install -y ./nfpm.deb
          sudo curl -fsSLo /usr/local/bin/linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          sudo chmod +x /usr/local/bin/linuxdeploy
        env:
          NFPM_VERSION: 2.48.0
          LINUXDEPLOY_VERSION: 1-alpha-20251107-1

      - name: Build .deb, .rpm and AppImage
        run: packaging/linux/package.sh "${{ steps.version.outputs.version }}" target/release dist
        env:
          # GitHub runners have no FUSE for the linuxdeploy AppImage itself.
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastDir-${{ steps.version.outputs.version }}-linux-x64
          path: dist/*

  # Desktop entry and AppStream metadata, checked with current validators
  # (software centers and Flathub read the newer AppStream tags).
  metadata:
    name: Validate Linux metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate packaging/linux/io.github.enekocm7.FastDir.desktop
          appstreamcli validate --no-net --explain \
            packaging/linux/io.github.enekocm7.FastDir.metainfo.xml

  macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with warm-cache.yml, which keeps the main cache this
          # restores. A tag run can only read caches from its own tag or
          # main, so saving one here would never be used again.
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # The workspace keeps a single version in [workspace.package].
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "fastdir") | .version')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Build
        run: cargo build --release --locked

      - name: Package tarball and dmg
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p staging dist dmg-root
          cp target/release/fastdir staging/FastDir
          cp target/release/fastdir-cli staging/fastdir-cli
          cp README.md staging/
          tar -czf "dist/FastDir-$v-macos-arm64.tar.gz" -C staging .
          cp staging/FastDir dmg-root/FastDir
          cp staging/fastdir-cli dmg-root/fastdir-cli
          cp README.md dmg-root/
          hdiutil create -volname "FastDir $v" -srcfolder dmg-root \
            -ov -format UDZO "dist/FastDir-$v-macos-arm64.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastDir-${{ steps.version.outputs.version }}-macos-arm64
          path: dist/*

  # Installs the packages on clean distro images and runs both binaries, so a
  # missing runtime dependency fails the release instead of a user's install.
  linux-test:
    name: Install test (${{ matrix.image }}, ${{ matrix.format }})
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", format: deb }
          - { image: "ubuntu:24.04", format: deb }
          - { image: "fedora:latest", format: rpm }
          - { image: "debian:12", format: AppImage }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FastDir-${{ needs.linux.outputs.version }}-linux-x64
          path: dist

      - name: Install the package
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.format }}" in
            deb)
              apt-get update
              apt-get install -y ./dist/*.deb
              fastdir=fastdir; cli=fastdir-cli ;;
            rpm)
              dnf install -y ./dist/*.rpm
              fastdir=fastdir; cli=fastdir-cli ;;
            AppImage)
              apt-get update
              # What a desktop already has; the AppImage brings the rest.
              apt-get install -y libfontconfig1 libvulkan1 libwayland-client0 \
                libxkbcommon0 libxkbcommon-x11-0
              chmod +x dist/*.AppImage
              export APPIMAGE_EXTRACT_AND_RUN=1
              fastdir=$(ls "$PWD"/dist/*.AppImage)
              cli=$fastdir ;;
          esac
          if [ "${{ matrix.format }}" != AppImage ]; then
            # Every shared library resolves, the files are where the desktop
            # and software centers look for them.
            ! ldd /usr/bin/fastdir /usr/bin/fastdir-cli | grep 'not found'
            test -f /usr/share/applications/io.github.enekocm7.FastDir.desktop
            test -f /usr/share/metainfo/io.github.enekocm7.FastDir.metainfo.xml
            test -f /usr/share/icons/hicolor/256x256/apps/io.github.enekocm7.FastDir.png
            test -f /usr/share/icons/hicolor/scalable/apps/io.github.enekocm7.FastDir.svg
          fi
          # The GUI binary runs headless for CLI subcommands, which loads all
          # of its libraries; then scan the whole file system.
          "$fastdir" scan /usr --max-depth 1 > /dev/null
          "$cli" scan / --max-depth 1 > scan.json
          head -c 400 scan.json; echo

  # Builds the Nix flake so `nix run github:enekocm7/fastdir` keeps working.
  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Build
        run: |
          nix build -L .#fastdir
          ./result/bin/fastdir-cli scan / --max-depth 1 > /dev/null
          nix flake check --no-build

  # One release with every platform's files and a single SHA256SUMS.txt (the
  # in-app updater looks its download up in that file).
  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [windows, linux, macos, metadata, linux-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FastDir-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: FastDir ${{ needs.linux.outputs.version }}
          generate_release_notes: true
          files: dist/*

  # Pushes the `fastdir-bin` PKGBUILD to the AUR for stable tags. Needs the
  # AUR_SSH_PRIVATE_KEY secret (an SSH key registered with the AUR account
  # that owns the package); skipped without it.
  aur:
    name: AUR (fastdir-bin)
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: [linux, publish]
    runs-on: ubuntu-24.04
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.AUR_SSH_PRIVATE_KEY != ''

      - uses: actions/download-artifact@v4
        if: env.AUR_SSH_PRIVATE_KEY != ''
        with:
          name: FastDir-${{ needs.linux.outputs.version }}-linux-x64
          path: dist

      - name: Fill in version and checksum
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          v="${{ needs.linux.outputs.version }}"
          sum=$(sha256sum "dist/FastDir-$v-amd64.deb" | cut -d' ' -f1)
          sed -i -e "s/^pkgver=.*/pkgver=$v/" -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/aur/fastdir-bin/PKGBUILD
          cat packaging/aur/fastdir-bin/PKGBUILD

      - name: Push to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: fastdir-bin
          pkgbuild: packaging/aur/fastdir-bin/PKGBUILD
          commit_username: ${{ vars.AUR_COMMIT_USERNAME || 'enekocm7' }}
          commit_email: ${{ vars.AUR_COMMIT_EMAIL || 'enekocm7@users.noreply.github.com' }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.linux.outputs.version }}
