<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <!-- Cushion shading, like the treemap: a soft highlight up and to the left. -->
    <radialGradient id="blue" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="0.45" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="red" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#fecaca"/>
      <stop offset="0.45" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="green" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.45" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="yellow" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="0.45" stop-color="#eab308"/>
      <stop offset="1" stop-color="#713f12"/>
    </radialGradient>
    <radialGradient id="purple" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset="0.45" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#cffafe"/>
      <stop offset="0.45" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#164e63"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- A squarified treemap: the biggest folder first. -->
  <rect x="24"  y="24"  width="116" height="208" rx="16" fill="url(#blue)"/>
  <rect x="148" y="24"  width="84"  height="108" rx="14" fill="url(#red)"/>
  <rect x="148" y="140" width="44"  height="92"  rx="12" fill="url(#green)"/>
  <rect x="200" y="140" width="32"  height="44"  rx="10" fill="url(#yellow)"/>
  <rect x="200" y="192" width="32"  height="18"  rx="6"  fill="url(#purple)"/>
  <rect x="200" y="216" width="32"  height="16"  rx="6"  fill="url(#cyan)"/>

  <!-- Speed bolt over the largest cell. -->
  <path d="M94 52 L52 136 L80 136 L66 204 L114 108 L86 108 Z"
        fill="url(#bolt)" stroke="#0b1120" stroke-opacity="0.35" stroke-width="4" stroke-linejoin="round"/>
</svg>
