ShortDescription: Blazing fast disk usage analyzer with a treemap
Description: |-
  FastDir scans a drive or folder on every CPU core and shows where the space went:
  a sortable directory tree, a per-extension and per-category breakdown and a
  cushion-shaded treemap. It can rename, move, trash or delete files without
  rescanning, find duplicates and compare saved scans. Also installs
  fastdir-cli, a headless scanner with JSON/CSV output and an MCP server.
